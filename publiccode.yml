description:
  en:
    shortDescription: How FPSOT products serve people with disabilities.
    longDescription: >
      The FPSOT accessibility specification sets WCAG 2.2 level AA, with four
      level AAA criteria, as the baseline of every FPSOT web page, document
      and mobile app. It fixes the values for contrast, focus, target size,
      motion and text alternatives, and sets how teams test a product, keep
      a test record, publish an accessibility statement and require
      accessibility in procurement with EN 301 549.
    features:
      - One accessibility profile for Canada and Québec
      - Test records and accessibility statements
  fr:
    shortDescription: Comment les produits de FPSOT servent les personnes handicapées.
    longDescription: >
      La spécification de FPSOT sur l'accessibilité fixe le niveau AA des
      WCAG 2.2, avec quatre critères de niveau AAA, comme base de chaque page
      Web, document et application mobile de FPSOT. Elle fixe les valeurs du
      contraste, du focus, de la taille des cibles, du mouvement et des
      équivalents textuels, ainsi que la façon de tester un produit, de tenir
      un registre d'essai, de publier une déclaration sur l'accessibilité et
      d'exiger l'accessibilité dans les acquisitions selon la norme EN 301 549.
    features:
      - Un seul profil d'accessibilité pour le Canada et le Québec
      - Registres d'essai et déclarations sur l'accessibilité
